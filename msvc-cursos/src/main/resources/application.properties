spring.application.name=msvc-cursos
server.port=8002
# spring.datasource.url=jdbc:postgresql://localhost:5432/msvc_cursos
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/msvc_cursos
spring.datasource.username=postgres
spring.datasource.password=sasa
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
                                                  #PostgreSQL10Dialect

# Crear las tablas en Postgres esto solo en desarrollo, en Produccion las tablas deben estar creadas:
spring.jpa.generate-ddl=true

#Ver trazas de Posgrest consultas, etc. en consolo de Spring:
logging.level.org.hibernate.SQL=debug

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
